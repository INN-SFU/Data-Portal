
services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: ams-keycloak-dev
    command: start-dev --import-realm
    environment:
      # KC bootstrap (owner: keycloak)
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN?error}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD?error}
      KC_DB: ${KC_DB:-dev-file} # default value INFO is the variable is not set or null
      KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED:-true}
      KC_METRICS_ENABLED: ${KC_METRICS_ENABLED:-true}
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-INFO}
      # KC_HOSTNAME: keycloak.local
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
    ports: ["8080:8080"]
    # extra_hosts:
    #   - "keycloak.local:127.0.0.1"
    volumes:
      - ./keycloak-realm-export.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          # open tcp socket, send HTTP request to /health/ready, and assert '200' in the response
          "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q ' 200' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - ams-network

networks:
  ams-network:
    driver: bridge
