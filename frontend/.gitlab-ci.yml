
# Use native Auto DevOps jobs (Auto Build/Test/Security/Deploy)
include:
  - template: Auto-DevOps.gitlab-ci.yml

# # Route jobs to the runner that mounts /var/run/docker.sock
# default:
#   tags:
#     - inn-runner-docker   # <-- tag of your Docker-capable runner

# Tell Auto DevOps to build from frontend/
variables:
  DOCKERFILE_PATH: frontend/Dockerfile
  AUTO_DEVOPS_BUILD_IMAGE_CONTEXT: frontend

  # Add multiple image tags at build time (branch + short SHA)
  # Auto DevOps will appended these to the docker build` as repeated --tag flags.
  AUTO_DEVOPS_BUILD_IMAGE_EXTRA_ARGS: >
    --tag ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_REF_SLUG}
    --tag ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHORT_SHA}

# Safety net test (kept until Auto Test/Herokuish consistently reliably detects tests)
frontend-test:
  stage: test
  image: node:20
  before_script:
    - cd frontend
  script:
    - npm test || echo "Tests failed or not detected by Auto DevOps"

# Post-build: add timestamp tag and branch-specific 'latest' tags
frontend-retag:
  stage: build
  image: docker:27-cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_API_VERSION: "1.41"
  rules:
    - when: on_success
  script:
    - ts=$(date -u +%Y%m%d-%H%M)
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

    # Pull the image built by Auto DevOps (SHA or fallback to branch tag)
    - docker pull "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}" || docker pull "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}" || true

    # Tag with timestamp (e.g., fronteend:20251222-2357)
    - docker tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}" "${CI_REGISTRY_IMAGE}/frontend:${ts}"
    - docker push "${CI_REGISTRY_IMAGE}/frontend:${ts}"

    # 'latest' for default branch (usually main)
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}" "${CI_REGISTRY_IMAGE}/frontend:latest"
        docker push "${CI_REGISTRY_IMAGE}/frontend:latest"
      fi

    # 'latest-dev' for development branch
    - |
      if [ "$CI_COMMIT_BRANCH" = "development" ]; then
        docker tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}" "${CI_REGISTRY_IMAGE}/frontend:latest-dev"
        docker push "${CI_REGISTRY_IMAGE}/frontend:latest-dev"
      fi
