version: "3.8"

services:
  storage-issuer:
    build: .
    container_name: ams-storage-issuer
    environment:
      # Service configuration
      ISSUER_HOST: 0.0.0.0
      ISSUER_PORT: "8001"
      LOG_LEVEL: INFO

      # JWT configuration
      JWT_ISSUER: ams-storage-issuer
      JWT_AUDIENCE: ams-storage-gateway
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key

      # Gateway URL (where tokens will be used)
      GATEWAY_URL: http://gateway.local:9000

      # API authentication (for Backend to call Issuer)
      ISSUER_API_KEY: ${ISSUER_API_KEY:-dev-api-key-change-in-production}

    ports:
      - "8001:8001"

    extra_hosts:
      - "backend.local:host-gateway"
      - "gateway.local:host-gateway"

    tmpfs:
      - /run/secrets:rw,noexec,nosuid,nodev

    working_dir: /app

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
