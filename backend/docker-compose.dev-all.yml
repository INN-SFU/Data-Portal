version: "3.8"

# Complete AMS System - Development Environment
# This compose file orchestrates all AMS services with proper dependencies
# Includes: Keycloak, Backend API, Frontend
#
# Usage: docker compose -f docker-compose.dev-all.yml up -d

services:
  # 1. Keycloak - Authentication Service
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: ams-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./config/keycloak-realm-export.json:/opt/keycloak/data/import/realm.json:ro
    networks:
      - ams-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q ' 200' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 2. Keycloak Configurator - One-time initialization
  keycloak-init:
    build: .
    container_name: ams-keycloak-init
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_DOMAIN: http://keycloak:8080
      KEYCLOAK_REALM: ams-portal
      KEYCLOAK_ADMIN_CLIENT_ID: ams-portal-admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    entrypoint: ["bash", "/app/init_keycloak.sh"]  # Override entrypoint to run init script
    networks:
      - ams-network
    restart: "no"  # Run once and exit

  # 3. Backend API - Main Application
  backend:
    build: .
    container_name: ams-backend
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
    entrypoint: ["bash", "/app/entrypoint.backend.sh"]
    environment:
      # Keycloak connection
      KEYCLOAK_DOMAIN: http://keycloak:8080
      KEYCLOAK_REALM: ams-portal
      KEYCLOAK_UI_CLIENT_ID: ams-portal-ui
      KEYCLOAK_ADMIN_CLIENT_ID: ams-portal-admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KEYCLOAK_ADMIN_CLIENT_SECRET_FILE: /run/secrets/kc_admin_client_secret
      # Token issuer must match the URL in JWT tokens (frontend accesses via localhost)
      KEYCLOAK_TOKEN_ISSUER: http://localhost:8080/realms/ams-portal
      # External issuer for smoke tests (how tokens are actually issued)
      KEYCLOAK_EXTERNAL_ISSUER: http://localhost:8080/realms/ams-portal

      # App/runtime config
      AMS_HOST: 0.0.0.0
      AMS_PORT: "8000"
      AMS_RELOAD: "false"
      SYSTEM_RESET: "false"
      LOG_LEVEL: INFO
      LOG_DIR: /app/data/logs
      API_VERSION: "0_1"

      # Casbin/data paths
      ENFORCER_MODEL: /app/core/settings/managers/policies/casbin/model.conf
      ENFORCER_POLICY: /app/core/settings/managers/policies/casbin/policy.csv
      USER_POLICIES: /app/data/policies
      INSTANCE_CONFIGS: /app/data/configs

      # Backend base URL
      BACKEND_BASE_URL: http://localhost:8000

      # Enable smoke tests
      RUN_SMOKE_TESTS: "true"

    ports:
      - "8000:8000"
    networks:
      - ams-network
    volumes:
      - .:/app
      - ./logs:/app/data/logs
      - ./data/policies:/app/data/policies
      - ./data/configs:/app/data/configs
    tmpfs:
      - /run/secrets:rw,noexec,nosuid,nodev
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 4. Frontend - Web UI
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_KEYCLOAK_URL: http://localhost:8080
        REACT_APP_KEYCLOAK_REALM: ams-portal
        REACT_APP_KEYCLOAK_CLIENT_ID: ams-portal-ui
    container_name: ams-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: ams-portal
      REACT_APP_KEYCLOAK_CLIENT_ID: ams-portal-ui
      API_GATEWAY: http://backend:8000
      SERVER_NAME: localhost
    ports:
      - "3000:80"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - ams-network

networks:
  ams-network:
    driver: bridge
