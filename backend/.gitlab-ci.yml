
# Use native Auto DevOps jobs (Auto Build/Test/Security/Deploy)
include:
  - template: Auto-DevOps.gitlab-ci.yml

# # Route jobs to the runner that mounts /var/run/docker.sock
# default:
#   tags:
#     - inn-runner-docker   # <-- tag of your Docker-capable runner

# Tell Auto DevOps to build from backend/
variables:
  DOCKERFILE_PATH: backend/Dockerfile
  AUTO_DEVOPS_BUILD_IMAGE_CONTEXT: backend

  # Add multiple image tags at build time (branch + short SHA)
  # These get appended to the docker build command.
  AUTO_DEVOPS_BUILD_IMAGE_EXTRA_ARGS: >
    --tag ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_REF_SLUG}
    --tag ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}

# Safety net: explicit backend test (until Auto Test consistently detects tests)
backend-test:
  stage: test
  image: python:3.12
  before_script:
    - cd backend
    - pip install -r requirements.txt
  script:
    - pytest -q || echo "Tests failed or not detected by Auto DevOps"

# Post-build: add timestamp tag and branch-specific 'latest' tags
backend-promote-tags:
  stage: build
  image: docker:27-cli
  # If your runner doesn't auto-mount the socket, uncomment the volume
  # volumes:
  #   - /var/run/docker.sock:/var/run/docker.sock
  rules:
    - when: on_success
  script:
    - ts=$(date -u +%Y%m%d-%H%M)
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

    # Pull the image built by Auto DevOps (SHA or fallback to branch tag)
    - docker pull "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}" || docker pull "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}" || true

    # Timestamp tag (e.g., backend:20251222-2357)
    - docker tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}" "${CI_REGISTRY_IMAGE}/backend:${ts}"
    - docker push "${CI_REGISTRY_IMAGE}/backend:${ts}"

    # 'latest' for default branch (usually main)
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}" "${CI_REGISTRY_IMAGE}/backend:latest"
        docker push "${CI_REGISTRY_IMAGE}/backend:latest"
      fi

    # 'latest-dev' for development branch
    - |
      if [ "$CI_COMMIT_BRANCH" = "development" ]; then
        docker tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}" "${CI_REGISTRY_IMAGE}/backend:latest-dev"
        docker push "${CI_REGISTRY_IMAGE}/backend:latest-dev"
      fi
