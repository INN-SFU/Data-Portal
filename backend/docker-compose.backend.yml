version: "3.8"

services:
  backend:
    build: .
    container_name: ams-backend-dev
    entrypoint: ["bash", "/app/entrypoint.backend.sh"]
    environment:
      # Keycloak connection (external instance on separate domain)
      KEYCLOAK_DOMAIN: http://keycloak.local:8080
      KEYCLOAK_REALM: ams-portal
      KEYCLOAK_UI_CLIENT_ID: ams-portal-ui
      KEYCLOAK_ADMIN_CLIENT_ID: ams-portal-admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KEYCLOAK_ADMIN_CLIENT_SECRET_FILE: /run/secrets/kc_admin_client_secret

      # App/runtime config
      AMS_HOST: 0.0.0.0
      AMS_PORT: "8000"
      AMS_RELOAD: "false"
      SYSTEM_RESET: "false"
      LOG_LEVEL: INFO
      LOG_DIR: /app/data/logs
      API_VERSION: "0_1"

      # Casbin/data paths
      ENFORCER_MODEL: /app/core/settings/managers/policies/casbin/model.conf
      ENFORCER_POLICY: /app/core/settings/managers/policies/casbin/policy.csv
      USER_POLICIES: /app/data/policies
      INSTANCE_CONFIGS: /app/data/configs

      # Optional: handy for running pytest from the host
      BACKEND_BASE_URL: http://localhost:8000

      # Storage Issuer configuration (internal service for JWT token generation)
      # Backend uses this to generate presigned URLs for POSIX file downloads
      # Uses Docker service name for internal network communication
      STORAGE_ISSUER_URL: http://storage-issuer:8001
      STORAGE_ISSUER_API_KEY_FILE: /run/secrets/storage_issuer_api_key

      # Control smoke test execution on startup (default: true)
      RUN_SMOKE_TESTS: "true"

    ports: ["8000:8000"]

    networks:
      - ams-network  # Shared network for backend, issuer, and gateway

    extra_hosts:
      # Keycloak uses host-gateway as it's external to the AMS network
      - "keycloak.local:host-gateway"

    volumes:
      - .:/app
      - ./logs:/app/data/logs
      - ./data/policies:/app/data/policies
      - ./data/configs:/app/data/configs
    tmpfs:
      - /run/secrets:rw,noexec,nosuid,nodev
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ams-network:
    # Shared network enables Docker DNS-based service discovery
    # Services can reach each other using service names (e.g., storage-issuer:8001)
    external: true
