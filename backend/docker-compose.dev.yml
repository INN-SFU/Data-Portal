version: '3.8'

services:
  # AMS Backend
  backend:
    build: .
    container_name: ams-backend-dev
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      # Keycloak configuration
      KEYCLOAK_DOMAIN: https://keycloak.rmcintos.cedar.researchcomputinggroup.ca
      KEYCLOAK_REALM: ams-portal
      KEYCLOAK_UI_CLIENT_ID: ams-portal-ui
      KEYCLOAK_ADMIN_CLIENT_ID: ams-portal-admin
      KEYCLOAK_REDIRECT_URI: https://inn.rmcintos.cedar.researchcomputinggroup.ca
      KEYCLOAK_ADMIN_CLIENT_SECRET: PhLbj8vraWnpbvPevBAERGj0g4rHcwAf
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      # Server configuration
      AMS_HOST: 0.0.0.0
      AMS_PORT: 8000
      AMS_RELOAD: false

      # System configuration
      SYSTEM_RESET: false

      # Logging configuration
      LOG_LEVEL: INFO
      LOG_DIR: /app/data/logs

      # API version
      API_VERSION: "0_1"
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      # Mount log directory for easy access
      - ./logs:/app/data/logs
      # Mount data directories for persistence
      - ./data/policies:/app/data/policies
      - ./data/configs:/app/data/configs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  backend_data: