version: '3.8'

services:
  # Keycloak Service
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.1
    container_name: ams-keycloak-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: dev-file
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    ports:
      - "8080:8080"
    command: start-dev --import-realm
    volumes:
      - ../config/keycloak-realm-export.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # AMS Backend
  backend:
    build: .
    container_name: ams-backend-dev
    environment:
      # Keycloak configuration
      KEYCLOAK_DOMAIN: http://keycloak:8080
      KEYCLOAK_REALM: ams-portal
      KEYCLOAK_UI_CLIENT_ID: ams-portal-ui
      KEYCLOAK_ADMIN_CLIENT_ID: ams-portal-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-your-client-secret}
      KEYCLOAK_REDIRECT_URI: http://localhost:3000/auth/callback

      # Server configuration
      AMS_HOST: 0.0.0.0
      AMS_PORT: 8000
      AMS_RELOAD: false

      # System configuration
      SYSTEM_RESET: false

      # Logging configuration
      LOG_LEVEL: INFO
      LOG_DIR: /app/data/logs

      # API version
      API_VERSION: "0_1"
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      # Mount log directory for easy access
      - ./logs:/app/data/logs
      # Mount data directories for persistence
      - ./data/policies:/app/data/policies
      - ./data/configs:/app/data/configs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  backend_data: