version: "3.8"

x-kc-shared: &kc_shared
  KEYCLOAK_REALM: ams-portal
  KEYCLOAK_UI_CLIENT_ID: ams-portal-ui
  KEYCLOAK_ADMIN_CLIENT_ID: ams-portal-admin
  # External issuer seen by tokens; must match KC_HOSTNAME below
  KEYCLOAK_TOKEN_ISSUER: http://localhost:8080/realms/ams-portal
  KEYCLOAK_REDIRECT_URI: http://localhost:3000/auth/callback

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: ams-keycloak-dev
    command: start-dev --import-realm
    environment:
      # KC bootstrap (owner: keycloak)
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: DEBUG
      KC_HOSTNAME: localhost            #
      KC_HOSTNAME_STRICT: "false"
    ports: ["8080:8080"]
    volumes:
      - ./config/keycloak-realm-export.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          # open tcp socket, send HTTP request to /health/ready, and assert '200' in the response
          "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q ' 200' <&3"
        ]
      interval: 300s
      timeout: 5s
      retries: 50
      start_period: 60s

  backend:
    build: .
    container_name: ams-backend-dev
    entrypoint: ["bash", "/app/entrypoint.sh"]
    environment:
      <<: *kc_shared
      KEYCLOAK_DOMAIN: http://keycloak:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123

      # App/runtime config
      AMS_HOST: 0.0.0.0
      AMS_PORT: "8000"
      AMS_RELOAD: "false"
      SYSTEM_RESET: "false"
      LOG_LEVEL: INFO
      LOG_DIR: /app/data/logs
      API_VERSION: "0_1"

      # Casbin/data paths
      ENFORCER_MODEL: /app/core/settings/managers/policies/casbin/model.conf
      ENFORCER_POLICY: /app/core/settings/managers/policies/casbin/policy.csv
      USER_POLICIES: /app/data/policies
      INSTANCE_CONFIGS: /app/data/configs

      # Tell app/tests where the secret lives
      KEYCLOAK_ADMIN_CLIENT_SECRET_FILE: /run/secrets/kc_admin_client_secret

      # Optional: handy for running pytest from the host
      BACKEND_BASE_URL: http://localhost:8000

      # Control smoke test execution on startup (default: true)
      RUN_SMOKE_TESTS: "true"

    ports: ["8000:8000"]
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - .:/app
      - ./logs:/app/data/logs
      - ./data/policies:/app/data/policies
      - ./data/configs:/app/data/configs
    tmpfs:
      - /run/secrets:rw,noexec,nosuid,nodev
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
