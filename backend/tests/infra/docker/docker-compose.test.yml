services:
  keycloak-test:
    image: quay.io/keycloak/keycloak:23.0.1
    container_name: keycloak-test
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: test123
      KC_DB: dev-file
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    ports:
      - "8081:8080"  # Different port to avoid conflicts with dev Keycloak
    command: start-dev --import-realm
    volumes:
      - ./test-configs/keycloak-realm-test.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  default:
    name: ams-test-network