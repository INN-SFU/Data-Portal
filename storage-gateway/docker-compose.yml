version: "3.8"

services:
  storage-gateway:
    build: .
    container_name: ams-storage-gateway
    ports:
      - "9000:9000"
    environment:
      # Server settings
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "9000"
      LOG_LEVEL: "INFO"

      # Storage settings
      STORAGE_ROOT_PATH: "/storage"

      # JWT validation settings (must match Storage Issuer)
      JWKS_URL: "http://storage-issuer:8001/.well-known/jwks.json"
      JWT_ISSUER: "ams-storage-issuer"
      JWT_AUDIENCE: "ams-storage-gateway"
      JWKS_CACHE_TTL: "3600"

      # Redis settings (for jti tracking)
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      # REDIS_PASSWORD: ""  # Optional

    volumes:
      # Mount storage directory (replace with actual path)
      - ./test-storage:/storage:ro  # Read-only access to storage

    depends_on:
      - redis

    networks:
      - storage-network
      - ams-network

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: ams-storage-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - storage-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  storage-network:
    # Internal network for Gateway and Redis
    driver: bridge
  ams-network:
    # Shared network for Backend to fetch file tree
    external: true

volumes:
  redis-data:
