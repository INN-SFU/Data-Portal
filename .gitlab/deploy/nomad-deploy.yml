# Nomad Deployment Integration with Auto DevOps
# This template provides Nomad deployment jobs following Auto DevOps patterns
# Structure mirrors: https://gitlab.com/gitlab-org/gitlab/blob/master/lib/gitlab/ci/templates/Jobs/Deploy.gitlab-ci.yml
#
# Base template: .deploy (hidden job, similar to Auto DevOps)
# Deploy jobs: deploy:review, deploy:development, deploy:staging, deploy:production
# Stop job: stop_review_app (for Review Apps cleanup)
#
# Staging deploys are disabled by default since continuous deployment to production
# is enabled by default. If you prefer to automatically deploy to staging and only
# manually promote to production, enable staging by setting STAGING_ENABLED.

# Helper template: Routing script for Traefik configuration
# Generates hostname and service tags based on environment and service type
.routing-script:
  before_script:
    - |
      # Determine if external access is needed
      NEEDS_EXTERNAL_ACCESS="false"
      
      if [ -n "$NOMAD_EXTERNAL_ACCESS" ]; then
        if [ "$NOMAD_EXTERNAL_ACCESS" = "true" ]; then
          NEEDS_EXTERNAL_ACCESS="true"
        fi
      else
        # Defaults: Review Apps and frontend always need external access
        if [ "$NOMAD_ENVIRONMENT" = "review" ] || [ "$SERVICE_NAME" = "frontend" ]; then
          NEEDS_EXTERNAL_ACCESS="true"
        fi
      fi
      
      if [ "$NEEDS_EXTERNAL_ACCESS" = "true" ]; then
        # Generate hostname based on environment
        if [ "$NOMAD_ENVIRONMENT" = "review" ]; then
          export __HOSTNAME__="${SERVICE_NAME}-${CI_COMMIT_REF_SLUG}.${NOMAD_DOMAIN:-example.com}"
        else
          export __HOSTNAME__="${SERVICE_NAME}-${NOMAD_ENVIRONMENT}.${NOMAD_DOMAIN:-example.com}"
        fi
        export NOMAD_ENVIRONMENT_URL="https://${__HOSTNAME__}"
        
        # Determine service type and port
        if [ "$SERVICE_NAME" = "frontend" ]; then
          SERVICE_TYPE="frontend"
          PORT="80"
        else
          SERVICE_TYPE="backend"
          PORT="__NOMAD_PORT_PLACEHOLDER__"
        fi
        
        # Build Traefik tags
        if [ "$SERVICE_TYPE" = "frontend" ]; then
          export __SERVICE_TAGS__="[\"${SERVICE_TYPE}\",\"traefik.enable=true\",\"traefik.http.routers.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.rule=Host(\`${__HOSTNAME__}\`)\",\"traefik.http.routers.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.entrypoints=websecure\",\"traefik.http.routers.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.tls=true\",\"traefik.http.services.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.loadbalancer.server.port=${PORT}\"]"
        else
          export __SERVICE_TAGS__="[\"${SERVICE_TYPE}\",\"api\",\"traefik.enable=true\",\"traefik.http.routers.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.rule=Host(\`${__HOSTNAME__}\`) || PathPrefix(\`/api/${__ENVIRONMENT_SANITIZED__}\`)\",\"traefik.http.routers.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.entrypoints=websecure\",\"traefik.http.routers.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.tls=true\",\"traefik.http.services.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.loadbalancer.server.port=${PORT}\"]"
        fi
      else
        # Internal access only via service discovery
        export __HOSTNAME__=""
        export NOMAD_ENVIRONMENT_URL=""
        export __SERVICE_TAGS__='["api"]'
      fi

# Base deploy template with common before_script and after_script
# Environment-specific jobs extend this and customize their own script/before_script
# Note: This base job should not run directly - it's extended by environment-specific jobs
.deploy:
  stage: deploy
  image: 
    name: hashicorp/nomad:latest
    entrypoint: [""]
  variables:
    NOMAD_DEPLOY_ENABLED: "${NOMAD_DEPLOY_ENABLED:-true}"
    NOMAD_DATACENTERS: "${NOMAD_DATACENTERS:-[\"dc1\"]}"
    NOMAD_JOB_DRIVER: "${NOMAD_JOB_DRIVER:-docker}"
    NOMAD_IMAGE_FORCE_PULL: "${NOMAD_IMAGE_FORCE_PULL:-true}"
    # Per-service external access control (overrides environment-based defaults)
    # Set to "true" to enable external access via Traefik, "false" to disable
    # If not set, uses environment-based defaults (review=true, others=false for backend)
    NOMAD_EXTERNAL_ACCESS: "${NOMAD_EXTERNAL_ACCESS:-}"
  dependencies:
    - build
  # Common before_script: setup tools, verify connection, set service variables
  before_script:
    # Install required tools
    - apk add --no-cache gettext docker-cli curl
    # Verify Nomad connection
    - |
      if [ -z "$NOMAD_SERVER_ADDRESS" ] || [ -z "$NOMAD_SERVER_TOKEN" ]; then
        echo "Error: NOMAD_SERVER_ADDRESS and NOMAD_SERVER_TOKEN must be set"
        exit 1
      fi
    - nomad version
    - |
      if ! nomad acl token self -address="$NOMAD_SERVER_ADDRESS" -token="$NOMAD_SERVER_TOKEN" > /dev/null 2>&1; then
        echo "Error: Cannot connect to Nomad cluster"
        exit 1
      fi
    # Set common service-specific variables
    # Note: Environment-specific variables (NOMAD_ENVIRONMENT, __ENVIRONMENT__, etc.)
    # should be set by extending jobs in their own before_script
    - |
      export __SERVICE__="${SERVICE_NAME}"
      export __IMAGE_NAME__="${CI_REGISTRY_IMAGE}/${SERVICE_NAME}"
      export __IMAGE_TAG__="${CI_COMMIT_SHORT_SHA}"
      export __DATACENTERS__="${NOMAD_DATACENTERS}"
      export __NAMESPACE__="${NOMAD_NAMESPACE:-default}"
      export __JOB_DRIVER__="${NOMAD_JOB_DRIVER}"
      export __IMAGE_FORCE_PULL__="${NOMAD_IMAGE_FORCE_PULL}"
      export __USERNAME__="${CI_REGISTRY_USER}"
      export __PASSWORD__="${CI_REGISTRY_PASSWORD}"
  # Main deployment script (can be customized by extending jobs)
  script:
    - |
      if [ "$NOMAD_DEPLOY_ENABLED" != "true" ]; then
        echo "Nomad deployment is disabled. Skipping..."
        exit 0
      fi
    # Determine template file
    - |
      if [ -z "$NOMAD_JOB_TEMPLATE" ]; then
        NOMAD_JOB_TEMPLATE=".gitlab/deploy/nomad-templates/${SERVICE_NAME}.template.nomad"
      fi
      if [ ! -f "$NOMAD_JOB_TEMPLATE" ]; then
        echo "Error: Nomad job template not found: $NOMAD_JOB_TEMPLATE"
        exit 1
      fi
    # Substitute variables in template
    - |
      # Determine variable list file
      if [ -z "$NOMAD_VARS_FILE" ]; then
        NOMAD_VARS_FILE=".gitlab/deploy/nomad-vars.txt"
      fi
      
      if [ ! -f "$NOMAD_VARS_FILE" ]; then
        echo "Error: Nomad variables file not found: $NOMAD_VARS_FILE"
        exit 1
      fi
      
      # Build substitution string from variable list file (using awk like backend.yaml)
      SHELL_FORMAT_STRING=$(cat "$NOMAD_VARS_FILE" | awk '{printf "$%s ", $1}')
      
      echo "Substituting variables from: $NOMAD_VARS_FILE"
      echo "Template file: $NOMAD_JOB_TEMPLATE"
      echo "Output file: ${SERVICE_NAME}-${__ENVIRONMENT__}.nomad"
      
      envsubst "$SHELL_FORMAT_STRING" < "$NOMAD_JOB_TEMPLATE" > "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad"
      
      # Replace NOMAD_PORT_http placeholder with Nomad runtime variable
      sed 's/__NOMAD_PORT_PLACEHOLDER__/${NOMAD_PORT_http}/g' "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad" > "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad.tmp"
      mv "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad.tmp" "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad"
      
      echo "===== Rendered Nomad job ====="
      cat "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad"
    # Validate Nomad job
    - |
      echo "===== Validating Nomad job ====="
      nomad job validate \
        -address="$NOMAD_SERVER_ADDRESS" \
        -token="$NOMAD_SERVER_TOKEN" \
        -namespace="$__NAMESPACE__" \
        "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad" || {
        echo "===== Nomad job file ====="
        cat "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad"
        exit 1
      }
    # Deploy to Nomad
    - |
      echo "===== Deploying to Nomad ====="
      nomad job run \
        -address="$NOMAD_SERVER_ADDRESS" \
        -token="$NOMAD_SERVER_TOKEN" \
        -namespace="$__NAMESPACE__" \
        -verbose \
        "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad"
    # Wait for deployment to be healthy
    # Ensure deployment is successful before marking job complete
    - |
      echo "===== Waiting for deployment to be healthy ====="
      MAX_WAIT=300
      WAIT_INTERVAL=10
      ELAPSED=0
      HEALTHY=false
      
      while [ $ELAPSED -lt $MAX_WAIT ]; do
        # Check job status
        JOB_STATUS=$(nomad job status \
          -address="$NOMAD_SERVER_ADDRESS" \
          -token="$NOMAD_SERVER_TOKEN" \
          -namespace="$__NAMESPACE__" \
          -short \
          "${__SERVICE__}-${__ENVIRONMENT__}" 2>/dev/null | head -5 || echo "")
        
        # Check if job is running
        if echo "$JOB_STATUS" | grep -q "Status.*=.*running"; then
          # Check if health checks are passing
          ALLOC_STATUS=$(nomad job allocs \
            -address="$NOMAD_SERVER_ADDRESS" \
            -token="$NOMAD_SERVER_TOKEN" \
            -namespace="$__NAMESPACE__" \
            "${__SERVICE__}-${__ENVIRONMENT__}" 2>/dev/null | grep -E "running|healthy" | head -1 || echo "")
          
          if echo "$ALLOC_STATUS" | grep -q "running"; then
            echo "Deployment is running and healthy"
            HEALTHY=true
            break
          fi
        fi
        
        # Check for failure
        if echo "$JOB_STATUS" | grep -qE "dead|failed"; then
          echo "Deployment failed: $JOB_STATUS"
          nomad job status \
            -address="$NOMAD_SERVER_ADDRESS" \
            -token="$NOMAD_SERVER_TOKEN" \
            -namespace="$__NAMESPACE__" \
            "${__SERVICE__}-${__ENVIRONMENT__}"
          exit 1
        fi
        
        echo "Waiting for deployment to be healthy... ($ELAPSED/$MAX_WAIT seconds)"
        sleep $WAIT_INTERVAL
        ELAPSED=$((ELAPSED + WAIT_INTERVAL))
      done
      
      if [ "$HEALTHY" != "true" ]; then
        echo "Timeout waiting for deployment to be healthy"
        nomad job status \
          -address="$NOMAD_SERVER_ADDRESS" \
          -token="$NOMAD_SERVER_TOKEN" \
          -namespace="$__NAMESPACE__" \
          "${__SERVICE__}-${__ENVIRONMENT__}"
        exit 1
      fi
      
      echo "===== Deployment successful and healthy ====="
  # Common after_script for cleanup/notification (can be customized by extending jobs)
  after_script:
    - echo "===== Deployment job completed ====="
    - |
      if [ -n "$NOMAD_ENVIRONMENT_URL" ]; then
        echo "Deployment URL: $NOMAD_ENVIRONMENT_URL"
      fi
  artifacts:
    paths:
      - "*.nomad"
    expire_in: 1 week
    when: always
  # Base rules - should not run directly (extended by specific deploy jobs)
  rules:
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    - if: '$DEPLOY_DISABLED == "true"'
      when: never

# Review App cleanup job (mirrors Auto DevOps stop_review_app pattern)
stop_review_app:
  extends: .deploy
  stage: deploy
  image:
    name: hashicorp/nomad:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    - apk add --no-cache gettext
    - |
      if [ -z "$NOMAD_SERVER_ADDRESS" ] || [ -z "$NOMAD_SERVER_TOKEN" ]; then
        echo "Error: NOMAD_SERVER_ADDRESS and NOMAD_SERVER_TOKEN must be set"
        exit 1
      fi
    - |
      # Determine environment name from CI_ENVIRONMENT_NAME
      JOB_NAME="${SERVICE_NAME}-${CI_ENVIRONMENT_NAME}"
      echo "Stopping Nomad job: $JOB_NAME"
      nomad job stop \
        -address="$NOMAD_SERVER_ADDRESS" \
        -token="$NOMAD_SERVER_TOKEN" \
        -namespace="${NOMAD_NAMESPACE:-default}" \
        -purge \
        "$JOB_NAME" || echo "Job $JOB_NAME not found or already stopped"
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: manual
      allow_failure: true
    - if: '$CI_ENVIRONMENT_NAME =~ /^review-/'
      when: manual
      allow_failure: true
  when: manual
  environment:
    name: $CI_ENVIRONMENT_NAME
    action: stop

# Deploy job for Review Apps (mirrors Auto DevOps deploy:review pattern)
deploy:review:
  extends: .deploy
  before_script:
    # Include common setup from .deploy template
    - !reference [.deploy, before_script]
    # Environment-specific setup for Review Apps
    # Determine environment for Review Apps
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        export NOMAD_ENVIRONMENT="review"
        export NOMAD_ENVIRONMENT_NAME="review-pr-${CI_MERGE_REQUEST_IID}"
      else
        export NOMAD_ENVIRONMENT="review"
        export NOMAD_ENVIRONMENT_NAME="review-${CI_COMMIT_REF_SLUG}"
      fi
      export __ENVIRONMENT__="${NOMAD_ENVIRONMENT_NAME}"
      export __ENVIRONMENT_SANITIZED__="${NOMAD_ENVIRONMENT_NAME}"
    - echo "Deploying to environment: $NOMAD_ENVIRONMENT_NAME"
    # Generate hostname and service tags for Traefik routing (using !reference)
    - !reference [.routing-script, before_script]
  rules:
    - if: '$NOMAD_DEPLOY_ENABLED == "true" && $CI_MERGE_REQUEST_IID'
      when: on_success
    - if: '$NOMAD_DEPLOY_ENABLED == "true" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH != "development" && $CI_COMMIT_BRANCH != "staging"'
      when: on_success
  environment:
    name: $NOMAD_ENVIRONMENT_NAME
    url: ${NOMAD_ENVIRONMENT_URL:-}
    on_stop: stop_review_app
    auto_stop_in: 1 week

# Deploy job for Development (mirrors Auto DevOps deploy:development pattern)
deploy:development:
  extends: .deploy
  before_script:
    # Include common setup from .deploy template
    - !reference [.deploy, before_script]
    # Environment-specific setup for Development
    - |
      export NOMAD_ENVIRONMENT="development"
      export NOMAD_ENVIRONMENT_NAME="development"
      export __ENVIRONMENT__="${NOMAD_ENVIRONMENT_NAME}"
      export __ENVIRONMENT_SANITIZED__="${NOMAD_ENVIRONMENT_NAME}"
    - echo "Deploying to environment: $NOMAD_ENVIRONMENT_NAME"
    # Generate hostname and service tags for Traefik routing (using !reference)
    - !reference [.routing-script, before_script]
  rules:
    - if: '$NOMAD_DEPLOY_ENABLED == "true" && $CI_COMMIT_BRANCH == "development"'
      when: on_success
  environment:
    name: development
    url: ${NOMAD_ENVIRONMENT_URL:-}

# Deploy job for Staging (mirrors Auto DevOps deploy:staging pattern)
# Staging deploys are disabled by default. Enable by setting STAGING_ENABLED.
deploy:staging:
  extends: .deploy
  before_script:
    # Include common setup from .deploy template
    - !reference [.deploy, before_script]
    # Environment-specific setup for Staging
    - |
      export NOMAD_ENVIRONMENT="staging"
      export NOMAD_ENVIRONMENT_NAME="staging"
      export __ENVIRONMENT__="${NOMAD_ENVIRONMENT_NAME}"
      export __ENVIRONMENT_SANITIZED__="${NOMAD_ENVIRONMENT_NAME}"
    - echo "Deploying to environment: $NOMAD_ENVIRONMENT_NAME"
    # Generate hostname and service tags for Traefik routing (using !reference)
    - !reference [.routing-script, before_script]
  rules:
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - if: '$STAGING_ENABLED'
      when: on_success
  environment:
    name: staging
    url: ${NOMAD_ENVIRONMENT_URL:-}

# Production deploy template (mirrors Auto DevOps .production pattern)
.production:
  extends: .deploy
  before_script:
    # Include common setup from .deploy template
    - !reference [.deploy, before_script]
    # Environment-specific setup for Production
    - |
      export NOMAD_ENVIRONMENT="production"
      export NOMAD_ENVIRONMENT_NAME="production"
      export __ENVIRONMENT__="${NOMAD_ENVIRONMENT_NAME}"
      export __ENVIRONMENT_SANITIZED__="${NOMAD_ENVIRONMENT_NAME}"
    - echo "Deploying to environment: $NOMAD_ENVIRONMENT_NAME"
    # Generate hostname and service tags for Traefik routing (using !reference)
    - !reference [.routing-script, before_script]
  environment:
    name: production
    url: ${NOMAD_ENVIRONMENT_URL:-}

# Deploy job for Production (mirrors Auto DevOps deploy:production pattern)
# Continuous deployment to production is enabled by default.
# If STAGING_ENABLED is set, this job is disabled and production_manual is used instead.
production:
  extends: .production
  rules:
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    - if: '$DEPLOY_DISABLED == "true"'
      when: never
    - if: '$STAGING_ENABLED'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

# Manual production deployment (used when STAGING_ENABLED is set)
# Allows manual promotion from staging to production
production_manual:
  extends: .production
  allow_failure: false
  when: manual
  rules:
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    - if: '$DEPLOY_DISABLED == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED'
      when: manual
