
# Simple root-level smoke test job (optional)
deploy-test:
  stage: deploy
  tags:
    - inn-runner-docker   # Replace with the tag you set during runner registration
  image: docker:27-cli    # Matches the executor image you configured
  script:
    - echo "Deploy stage is triggered!"


# Nomad Deployment Integration with Auto DevOps
# This template provides Nomad deployment jobs following Auto DevOps patterns
# Structure mirrors: https://gitlab.com/gitlab-org/gitlab/blob/master/lib/gitlab/ci/templates/Jobs/Deploy.gitlab-ci.yml
#
# Base template: .deploy (hidden job, similar to Auto DevOps)
# Deploy jobs: review, staging, production (mirrors Auto DevOps naming)
# Additional: deploy:development (Nomad-specific, not in Auto DevOps)
# Stop job: stop_review (for Review Apps cleanup, mirrors Auto DevOps)
#
# Staging deploys are disabled by default since continuous deployment to production
# is enabled by default. If you prefer to automatically deploy to staging and only
# manually promote to production, enable staging by setting STAGING_ENABLED.

# Preparation job: Generate reusable helper scripts
# Runs before all deploy jobs to create shared scripts, reducing duplication
prepare-nomad-scripts:
  stage: build
  image: alpine:latest
  script:
    # Create nomad-setup.sh: Install tools, verify connection, set service variables
    # Note: nomad CLI is already available in hashicorp/nomad:latest image
    - |
      cat > nomad-setup.sh << 'SETUP_EOF'
      #!/bin/sh
      set -e
      
      # Install gettext for envsubst (not included in hashicorp/nomad image)
      apk add --no-cache gettext > /dev/null 2>&1
      
      # Verify Nomad connection
      if [ -z "$NOMAD_SERVER_ADDRESS" ] || [ -z "$NOMAD_SERVER_TOKEN" ]; then
        echo "Error: NOMAD_SERVER_ADDRESS and NOMAD_SERVER_TOKEN must be set"
        exit 1
      fi
      
      # Verify nomad CLI is available (should be in hashicorp/nomad image)
      if ! command -v nomad > /dev/null 2>&1; then
        echo "Error: nomad CLI not found in image"
        exit 1
      fi
      
      nomad version
      
      if ! nomad acl token self -address="$NOMAD_SERVER_ADDRESS" -token="$NOMAD_SERVER_TOKEN" > /dev/null 2>&1; then
        echo "Error: Cannot connect to Nomad cluster"
        exit 1
      fi
      
      # Set common service-specific variables
      export __SERVICE__="${SERVICE_NAME}"
      export __IMAGE_NAME__="${CI_REGISTRY_IMAGE}/${SERVICE_NAME}"
      export __IMAGE_TAG__="${CI_COMMIT_SHORT_SHA}"
      export __DATACENTERS__="${NOMAD_DATACENTERS}"
      export __NAMESPACE__="${NOMAD_NAMESPACE:-default}"
      export __JOB_DRIVER__="${NOMAD_JOB_DRIVER}"
      export __IMAGE_FORCE_PULL__="${NOMAD_IMAGE_FORCE_PULL}"
      export __USERNAME__="${CI_REGISTRY_USER}"
      export __PASSWORD__="${CI_REGISTRY_PASSWORD}"
      SETUP_EOF
    # Create nomad-routing.sh: Generate hostname and Traefik tags
    - |
      cat > nomad-routing.sh << 'ROUTING_EOF'
      #!/bin/sh
      set -e
      
      # Determine if external access is needed
      NEEDS_EXTERNAL_ACCESS="false"
      
      if [ -n "$NOMAD_EXTERNAL_ACCESS" ]; then
        if [ "$NOMAD_EXTERNAL_ACCESS" = "true" ]; then
          NEEDS_EXTERNAL_ACCESS="true"
        fi
      else
        # Defaults: Review Apps and frontend always need external access
        if [ "$NOMAD_ENVIRONMENT" = "review" ] || [ "$SERVICE_NAME" = "frontend" ]; then
          NEEDS_EXTERNAL_ACCESS="true"
        fi
      fi
      
      if [ "$NEEDS_EXTERNAL_ACCESS" = "true" ]; then
        # Generate hostname based on environment
        # For review, use branch name (CI_COMMIT_REF_SLUG) for hostname
        if [ "$NOMAD_ENVIRONMENT" = "review" ]; then
          export __HOSTNAME__="${SERVICE_NAME}-${CI_COMMIT_REF_SLUG}.${NOMAD_DOMAIN:-example.com}"
        else
          export __HOSTNAME__="${SERVICE_NAME}-${NOMAD_ENVIRONMENT}.${NOMAD_DOMAIN:-example.com}"
        fi
        export NOMAD_ENVIRONMENT_URL="https://${__HOSTNAME__}"
        
        # Determine service type and port
        if [ "$SERVICE_NAME" = "frontend" ]; then
          SERVICE_TYPE="frontend"
          PORT="80"
        else
          SERVICE_TYPE="backend"
          PORT="__NOMAD_PORT_PLACEHOLDER__"
        fi
        
        # Build Traefik tags
        if [ "$SERVICE_TYPE" = "frontend" ]; then
          export __SERVICE_TAGS__="[\"${SERVICE_TYPE}\",\"traefik.enable=true\",\"traefik.http.routers.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.rule=Host(\`${__HOSTNAME__}\`)\",\"traefik.http.routers.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.entrypoints=websecure\",\"traefik.http.routers.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.tls=true\",\"traefik.http.services.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.loadbalancer.server.port=${PORT}\"]"
        else
          export __SERVICE_TAGS__="[\"${SERVICE_TYPE}\",\"api\",\"traefik.enable=true\",\"traefik.http.routers.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.rule=Host(\`${__HOSTNAME__}\`) || PathPrefix(\`/api/${__ENVIRONMENT_SANITIZED__}\`)\",\"traefik.http.routers.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.entrypoints=websecure\",\"traefik.http.routers.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.tls=true\",\"traefik.http.services.${__SERVICE__}-${__ENVIRONMENT_SANITIZED__}.loadbalancer.server.port=${PORT}\"]"
        fi
      else
        # Internal access only via service discovery
        export __HOSTNAME__=""
        export NOMAD_ENVIRONMENT_URL=""
        export __SERVICE_TAGS__='["api"]'
      fi
      ROUTING_EOF
    # Create nomad-deploy.sh: Template substitution, validation, deployment, health check
    - |
      cat > nomad-deploy.sh << 'DEPLOY_EOF'
      #!/bin/sh
      set -e
      
      # Check if deployment is enabled
      if [ "$NOMAD_DEPLOY_ENABLED" != "true" ]; then
        echo "Nomad deployment is disabled. Skipping..."
        exit 0
      fi
      
      # Determine template file
      if [ -z "$NOMAD_JOB_TEMPLATE" ]; then
        NOMAD_JOB_TEMPLATE=".gitlab/deploy/nomad-templates/${SERVICE_NAME}.template.nomad"
      fi
      if [ ! -f "$NOMAD_JOB_TEMPLATE" ]; then
        echo "Error: Nomad job template not found: $NOMAD_JOB_TEMPLATE"
        exit 1
      fi
      
      # Substitute variables in template
      # Determine variable list file
      if [ -z "$NOMAD_VARS_FILE" ]; then
        NOMAD_VARS_FILE=".gitlab/deploy/nomad-vars.txt"
      fi
      
      if [ ! -f "$NOMAD_VARS_FILE" ]; then
        echo "Error: Nomad variables file not found: $NOMAD_VARS_FILE"
        exit 1
      fi
      
      # Build substitution string from variable list file (using awk like backend.yaml)
      SHELL_FORMAT_STRING=$(cat "$NOMAD_VARS_FILE" | awk '{printf "$%s ", $1}')
      
      echo "Substituting variables from: $NOMAD_VARS_FILE"
      echo "Template file: $NOMAD_JOB_TEMPLATE"
      echo "Output file: ${SERVICE_NAME}-${__ENVIRONMENT__}.nomad"
      
      envsubst "$SHELL_FORMAT_STRING" < "$NOMAD_JOB_TEMPLATE" > "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad"
      
      # Replace NOMAD_PORT_http placeholder with Nomad runtime variable
      sed 's/__NOMAD_PORT_PLACEHOLDER__/${NOMAD_PORT_http}/g' "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad" > "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad.tmp"
      mv "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad.tmp" "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad"
      
      echo "===== Rendered Nomad job ====="
      cat "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad"
      
      # Validate Nomad job
      echo "===== Validating Nomad job ====="
      nomad job validate \
        -address="$NOMAD_SERVER_ADDRESS" \
        -token="$NOMAD_SERVER_TOKEN" \
        -namespace="$__NAMESPACE__" \
        "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad" || {
        echo "===== Nomad job file ====="
        cat "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad"
        exit 1
      }
      
      # Deploy to Nomad
      echo "===== Deploying to Nomad ====="
      nomad job run \
        -address="$NOMAD_SERVER_ADDRESS" \
        -token="$NOMAD_SERVER_TOKEN" \
        -namespace="$__NAMESPACE__" \
        -verbose \
        "${SERVICE_NAME}-${__ENVIRONMENT__}.nomad"
      
      # Wait for deployment to be healthy
      echo "===== Waiting for deployment to be healthy ====="
      MAX_WAIT=300
      WAIT_INTERVAL=10
      ELAPSED=0
      HEALTHY=false
      
      while [ $ELAPSED -lt $MAX_WAIT ]; do
        # Check job status
        JOB_STATUS=$(nomad job status \
          -address="$NOMAD_SERVER_ADDRESS" \
          -token="$NOMAD_SERVER_TOKEN" \
          -namespace="$__NAMESPACE__" \
          -short \
          "${__SERVICE__}-${__ENVIRONMENT__}" 2>/dev/null | head -5 || echo "")
        
        # Check if job is running
        if echo "$JOB_STATUS" | grep -q "Status.*=.*running"; then
          # Check if health checks are passing
          ALLOC_STATUS=$(nomad job allocs \
            -address="$NOMAD_SERVER_ADDRESS" \
            -token="$NOMAD_SERVER_TOKEN" \
            -namespace="$__NAMESPACE__" \
            "${__SERVICE__}-${__ENVIRONMENT__}" 2>/dev/null | grep -E "running|healthy" | head -1 || echo "")
          
          if echo "$ALLOC_STATUS" | grep -q "running"; then
            echo "Deployment is running and healthy"
            HEALTHY=true
            break
          fi
        fi
        
        # Check for failure
        if echo "$JOB_STATUS" | grep -qE "dead|failed"; then
          echo "Deployment failed: $JOB_STATUS"
          nomad job status \
            -address="$NOMAD_SERVER_ADDRESS" \
            -token="$NOMAD_SERVER_TOKEN" \
            -namespace="$__NAMESPACE__" \
            "${__SERVICE__}-${__ENVIRONMENT__}"
          exit 1
        fi
        
        echo "Waiting for deployment to be healthy... ($ELAPSED/$MAX_WAIT seconds)"
        sleep $WAIT_INTERVAL
        ELAPSED=$((ELAPSED + WAIT_INTERVAL))
      done
      
      if [ "$HEALTHY" != "true" ]; then
        echo "Timeout waiting for deployment to be healthy"
        nomad job status \
          -address="$NOMAD_SERVER_ADDRESS" \
          -token="$NOMAD_SERVER_TOKEN" \
          -namespace="$__NAMESPACE__" \
          "${__SERVICE__}-${__ENVIRONMENT__}"
        exit 1
      fi
      
      echo "===== Deployment successful and healthy ====="
      DEPLOY_EOF
    # Make scripts executable
    - chmod +x nomad-setup.sh nomad-routing.sh nomad-deploy.sh
    - ls -la *.sh
  artifacts:
    paths:
      - "*.sh"
    expire_in: 1 hour
  rules:
    - if: '$NOMAD_DEPLOY_ENABLED == "true"'
      when: on_success
    - when: never

# Base deploy template (mirrors Auto DevOps .auto-deploy pattern)
.deploy:
  stage: deploy
  image: 
    name: hashicorp/nomad:latest
    entrypoint: [""]
  variables:
    NOMAD_DEPLOY_ENABLED: "${NOMAD_DEPLOY_ENABLED:-true}"
    NOMAD_DATACENTERS: "${NOMAD_DATACENTERS:-[\"dc1\"]}"
    NOMAD_JOB_DRIVER: "${NOMAD_JOB_DRIVER:-docker}"
    NOMAD_IMAGE_FORCE_PULL: "${NOMAD_IMAGE_FORCE_PULL:-true}"
    # Per-service external access control (overrides environment-based defaults)
    # Set to "true" to enable external access via Traefik, "false" to disable
    # If not set, uses environment-based defaults (review=true, others=false for backend)
    NOMAD_EXTERNAL_ACCESS: "${NOMAD_EXTERNAL_ACCESS:-}"
  needs:
    - job: build
      artifacts: false
    - job: prepare-nomad-scripts
      artifacts: true
  after_script:
    - echo "===== Deployment job completed ====="
    - |
      if [ -n "$NOMAD_ENVIRONMENT_URL" ]; then
        echo "Deployment URL: $NOMAD_ENVIRONMENT_URL"
      fi
  artifacts:
    paths:
      - "*.nomad"
    expire_in: 1 week
    when: always
  # Base rules - should not run directly (extended by specific deploy jobs)
  # NOTE: DEPLOY_DISABLED is only for Auto DevOps Kubernetes deployment, not Nomad
  # Nomad jobs should only check NOMAD_DEPLOY_ENABLED
  rules:
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    # - if: '$DEPLOY_DISABLED == "true"'
    #   when: never

# Production deploy template (mirrors Auto DevOps .production pattern)
# Uses extends instead of YAML anchors for better compatibility with GitLab CI
# NOTE: Renamed to .nomad-production to avoid conflict with Auto DevOps .production template
.nomad-production:
  extends: .deploy
  stage: production
  script:
    # Source helper scripts (setup, routing, deploy)
    # Environment-specific setup for Production
    - |
      source nomad-setup.sh || exit 1
      export NOMAD_ENVIRONMENT="production"
      export NOMAD_ENVIRONMENT_NAME="production"
      export __ENVIRONMENT__="${NOMAD_ENVIRONMENT_NAME}"
      export __ENVIRONMENT_SANITIZED__="${NOMAD_ENVIRONMENT_NAME}"
      echo "Deploying to environment: $NOMAD_ENVIRONMENT_NAME"
      source nomad-routing.sh || exit 1
      source nomad-deploy.sh || exit 1
    # Note: Auto DevOps has "auto-deploy delete canary" here
    # For Nomad, canary allocations are part of the same job and are promoted automatically
    # If manual canary cleanup is needed, it can be added here
  environment:
    name: production
    url: ${NOMAD_ENVIRONMENT_URL:-}
  artifacts:
    paths:
      - "*.nomad"
    expire_in: 1 week
    when: always

# Deploy job for Production (mirrors Auto DevOps production pattern)
# Continuous deployment to production is enabled by default.
# If STAGING_ENABLED is set, this job is disabled and production_manual is used instead.
# NOTE: Renamed to nomad:production to avoid conflict with Auto DevOps production job
nomad:production:
  extends: .nomad-production
  rules:
    - if: '$CI_DEPLOY_FREEZE'
      when: never
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    - if: '$DEPLOY_DISABLED == "true"'
      when: never
    - if: '$STAGING_ENABLED'
      when: never
    - if: '$CANARY_ENABLED'
      when: never
    - if: '$INCREMENTAL_ROLLOUT_ENABLED'
      when: never
    - if: '$INCREMENTAL_ROLLOUT_MODE'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

# Manual production deployment (used when STAGING_ENABLED is set)
# Allows manual promotion from staging to production
production_manual:
  extends: .nomad-production
  allow_failure: false
  when: manual
  rules:
    - if: '$CI_DEPLOY_FREEZE'
      when: never
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    - if: '$DEPLOY_DISABLED == "true"'
      when: never
    - if: '$INCREMENTAL_ROLLOUT_ENABLED'
      when: never
    - if: '$INCREMENTAL_ROLLOUT_MODE'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CANARY_ENABLED'
      when: manual

# Deploy job for Review Apps (mirrors Auto DevOps review pattern)
# Note: Does not use 'extends' to avoid merge conflicts with Auto DevOps review job
review:
  stage: review
  image: 
    name: hashicorp/nomad:latest
    entrypoint: [""]
  variables:
    NOMAD_DEPLOY_ENABLED: "${NOMAD_DEPLOY_ENABLED:-true}"
    NOMAD_DATACENTERS: "${NOMAD_DATACENTERS:-[\"dc1\"]}"
    NOMAD_JOB_DRIVER: "${NOMAD_JOB_DRIVER:-docker}"
    NOMAD_IMAGE_FORCE_PULL: "${NOMAD_IMAGE_FORCE_PULL:-true}"
    NOMAD_EXTERNAL_ACCESS: "${NOMAD_EXTERNAL_ACCESS:-}"
  needs:
    - job: build
      artifacts: false
    - job: prepare-nomad-scripts
      artifacts: true
  before_script:
    # Verify artifacts are downloaded and in the expected location
    - |
      echo "===== Artifact Verification (before_script) ====="
      echo "Working directory: $(pwd)"
      echo "CI_PROJECT_DIR: ${CI_PROJECT_DIR:-not set}"
      echo "Listing all files:"
      find . -name "nomad-*.sh" -type f 2>/dev/null || echo "No nomad-*.sh files found anywhere"
      echo "Files in current directory:"
      ls -la || echo "ls failed"
      echo "Files matching *.sh:"
      ls -la *.sh 2>&1 || echo "No *.sh files in current directory"
  script:
    # Source helper scripts (setup, routing, deploy)
    - |
      source nomad-setup.sh || exit 1
      # Environment-specific setup for Review Apps
      # Use Auto DevOps environment name format: review/$CI_COMMIT_REF_NAME
      export NOMAD_ENVIRONMENT="review"
      export NOMAD_ENVIRONMENT_NAME="review/$CI_COMMIT_REF_NAME"
      # For Nomad job naming, use sanitized version
      export __ENVIRONMENT__="review-${CI_COMMIT_REF_SLUG}"
      export __ENVIRONMENT_SANITIZED__="review-${CI_COMMIT_REF_SLUG}"
      echo "Deploying to environment: $NOMAD_ENVIRONMENT_NAME"
      source nomad-routing.sh || exit 1
      source nomad-deploy.sh || exit 1
  rules:
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    - if: '$DEPLOY_DISABLED == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: never
    - if: '$REVIEW_DISABLED'
      when: never
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH'
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: ${NOMAD_ENVIRONMENT_URL:-}
    on_stop: stop_review
    auto_stop_in: 1 week
  artifacts:
    paths:
      - "*.nomad"
    expire_in: 1 week
    when: always
  after_script:
    - echo "===== Deployment job completed ====="
    - |
      if [ -n "$NOMAD_ENVIRONMENT_URL" ]; then
        echo "Deployment URL: $NOMAD_ENVIRONMENT_URL"
      fi

# Deploy job for Development (mirrors Auto DevOps deploy:development pattern)
# Note: Auto DevOps doesn't have a development job, but we keep it for Nomad-specific needs
deploy:development:
  extends: .deploy
  stage: deploy
  script:
    # Source helper scripts (setup, routing, deploy)
    # Environment-specific setup for Development
    - |
      source nomad-setup.sh || exit 1
      export NOMAD_ENVIRONMENT="development"
      export NOMAD_ENVIRONMENT_NAME="development"
      export __ENVIRONMENT__="${NOMAD_ENVIRONMENT_NAME}"
      export __ENVIRONMENT_SANITIZED__="${NOMAD_ENVIRONMENT_NAME}"
      echo "Deploying to environment: $NOMAD_ENVIRONMENT_NAME"
      source nomad-routing.sh || exit 1
      source nomad-deploy.sh || exit 1
  rules:
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    - if: '$DEPLOY_DISABLED == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "development"'
      when: on_success
  environment:
    name: development
    url: ${NOMAD_ENVIRONMENT_URL:-}

# Deploy job for Staging (mirrors Auto DevOps staging pattern)
# Staging deploys are disabled by default. Enable by setting STAGING_ENABLED.
staging:
  extends: .deploy
  stage: staging
  script:
    # Source helper scripts (setup, routing, deploy)
    # Environment-specific setup for Staging
    - |
      source nomad-setup.sh || exit 1
      export NOMAD_ENVIRONMENT="staging"
      export NOMAD_ENVIRONMENT_NAME="staging"
      export __ENVIRONMENT__="${NOMAD_ENVIRONMENT_NAME}"
      export __ENVIRONMENT_SANITIZED__="${NOMAD_ENVIRONMENT_NAME}"
      echo "Deploying to environment: $NOMAD_ENVIRONMENT_NAME"
      source nomad-routing.sh || exit 1
      source nomad-deploy.sh || exit 1
  rules:
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    - if: '$DEPLOY_DISABLED == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - if: '$STAGING_ENABLED'
  environment:
    name: staging
    url: ${NOMAD_ENVIRONMENT_URL:-}

# Canaries are disabled by default, but if you want them,
# and know what the downsides are, you can enable this by setting
# CANARY_ENABLED.
canary:
  extends: .deploy
  stage: canary
  allow_failure: true
  script:
    # Source helper scripts (setup, routing, deploy)
    # Environment-specific setup for Canary (deploys to production with canary strategy)
    - |
      source nomad-setup.sh || exit 1
      export NOMAD_ENVIRONMENT="production"
      export NOMAD_ENVIRONMENT_NAME="production"
      export __ENVIRONMENT__="${NOMAD_ENVIRONMENT_NAME}"
      export __ENVIRONMENT_SANITIZED__="${NOMAD_ENVIRONMENT_NAME}"
      # Set canary percentage (50% for canary job)
      export NOMAD_CANARY_COUNT="1"
      export ROLLOUT_PERCENTAGE="50"
      echo "Deploying canary to environment: $NOMAD_ENVIRONMENT_NAME"
      source nomad-routing.sh || exit 1
      # Use canary deployment script (similar to nomad-deploy.sh but with canary support)
      source nomad-deploy.sh || exit 1
  rules:
    - if: '$CI_DEPLOY_FREEZE'
      when: never
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    - if: '$DEPLOY_DISABLED == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - if: '$CANARY_ENABLED'
      when: manual
  environment:
    name: production
    url: ${NOMAD_ENVIRONMENT_URL:-}

# This job implements incremental rollout on for every push to the default branch.

.rollout: &rollout_template
  extends: .deploy
  script:
    # Source helper scripts (setup, routing, deploy)
    # Environment-specific setup for Rollout (deploys to production with percentage)
    - |
      source nomad-setup.sh || exit 1
      export NOMAD_ENVIRONMENT="production"
      export NOMAD_ENVIRONMENT_NAME="production"
      export __ENVIRONMENT__="${NOMAD_ENVIRONMENT_NAME}"
      export __ENVIRONMENT_SANITIZED__="${NOMAD_ENVIRONMENT_NAME}"
      # ROLLOUT_PERCENTAGE is set by the extending job
      # Calculate canary count based on percentage (simplified: use 1 canary for now)
      export NOMAD_CANARY_COUNT="1"
      echo "Deploying rollout (${ROLLOUT_PERCENTAGE}%) to environment: $NOMAD_ENVIRONMENT_NAME"
      source nomad-routing.sh || exit 1
      # Use rollout deployment script (similar to nomad-deploy.sh but with percentage support)
      source nomad-deploy.sh || exit 1
  environment:
    name: production
    url: ${NOMAD_ENVIRONMENT_URL:-}
  artifacts:
    paths:
      - "*.nomad"
    expire_in: 1 week
    when: always

.manual_rollout_template: &manual_rollout_template
  <<: *rollout_template
  stage: production
  resource_group: production
  allow_failure: true
  rules:
    - if: '$CI_DEPLOY_FREEZE'
      when: never
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    - if: '$DEPLOY_DISABLED == "true"'
      when: never
    - if: '$INCREMENTAL_ROLLOUT_MODE == "timed"'
      when: never
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    # $INCREMENTAL_ROLLOUT_ENABLED is for compatibility with pre-GitLab 11.4 syntax
    - if: '$INCREMENTAL_ROLLOUT_MODE == "manual" || $INCREMENTAL_ROLLOUT_ENABLED'
      when: manual

.timed_rollout_template: &timed_rollout_template
  <<: *rollout_template
  rules:
    - if: '$CI_DEPLOY_FREEZE'
      when: never
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    - if: '$DEPLOY_DISABLED == "true"'
      when: never
    - if: '$INCREMENTAL_ROLLOUT_MODE == "manual"'
      when: never
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - if: '$INCREMENTAL_ROLLOUT_MODE == "timed"'
      when: delayed
      start_in: 5 minutes

timed rollout 10%:
  <<: *timed_rollout_template
  stage: incremental rollout 10%
  variables:
    ROLLOUT_PERCENTAGE: 10

timed rollout 25%:
  <<: *timed_rollout_template
  stage: incremental rollout 25%
  variables:
    ROLLOUT_PERCENTAGE: 25

timed rollout 50%:
  <<: *timed_rollout_template
  stage: incremental rollout 50%
  variables:
    ROLLOUT_PERCENTAGE: 50

timed rollout 100%:
  extends:
    - .timed_rollout_template
    - .nomad-production
  stage: incremental rollout 100%
  variables:
    ROLLOUT_PERCENTAGE: 100

rollout 10%:
  <<: *manual_rollout_template
  variables:
    ROLLOUT_PERCENTAGE: 10

rollout 25%:
  <<: *manual_rollout_template
  variables:
    ROLLOUT_PERCENTAGE: 25

rollout 50%:
  <<: *manual_rollout_template
  variables:
    ROLLOUT_PERCENTAGE: 50

rollout 100%:
  extends:
    - .manual_rollout_template
    - .nomad-production
  allow_failure: false

# Review App cleanup job (mirrors Auto DevOps stop_review pattern)
stop_review:
  extends: .deploy
  stage: cleanup
  image:
    name: hashicorp/nomad:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    # Note: nomad CLI is already available in hashicorp/nomad:latest image
    # No additional packages needed for stop_review job
    - |
      if [ -z "$NOMAD_SERVER_ADDRESS" ] || [ -z "$NOMAD_SERVER_TOKEN" ]; then
        echo "Error: NOMAD_SERVER_ADDRESS and NOMAD_SERVER_TOKEN must be set"
        exit 1
      fi
      # Determine environment name from CI_ENVIRONMENT_NAME
      # Auto DevOps uses review/$CI_COMMIT_REF_NAME format, convert to Nomad job name
      if echo "$CI_ENVIRONMENT_NAME" | grep -q "^review/"; then
        # Extract branch name from review/$CI_COMMIT_REF_NAME
        BRANCH_NAME=$(echo "$CI_ENVIRONMENT_NAME" | sed 's|^review/||')
        JOB_NAME="${SERVICE_NAME}-review-$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g')"
      else
        JOB_NAME="${SERVICE_NAME}-${CI_ENVIRONMENT_NAME}"
      fi
      echo "Stopping Nomad job: $JOB_NAME"
      nomad job stop \
        -address="$NOMAD_SERVER_ADDRESS" \
        -token="$NOMAD_SERVER_TOKEN" \
        -namespace="${NOMAD_NAMESPACE:-default}" \
        -purge \
        "$JOB_NAME" || echo "Job $JOB_NAME not found or already stopped"
  rules:
    - if: '$NOMAD_DEPLOY_ENABLED != "true"'
      when: never
    - if: '$DEPLOY_DISABLED == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: never
    - if: '$REVIEW_DISABLED'
      when: never
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH'
      when: manual
  allow_failure: true
  environment:
    name: review/$CI_COMMIT_REF_NAME
    action: stop
