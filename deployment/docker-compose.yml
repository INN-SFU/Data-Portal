
services:
  ams-portal:
    build: ../backend
    container_name: ams-portal
    ports:
      - "${AMS_PORT:-8000}:8000"
    environment:
      - AMS_HOST=0.0.0.0
      - AMS_PORT=8000
    volumes:
      # Mount configuration files
      - ../config.yaml:/app/config.yaml:ro
      - ../backend/core/settings/.env:/app/core/settings/.env:ro
      - ../backend/core/settings/security/.secrets:/app/core/settings/security/.secrets:ro
      
      # Mount data directories (optional - for persistent storage configs)
      - ../backend/core/settings/managers/endpoints/configs:/app/core/settings/managers/endpoints/configs
      - ../backend/core/settings/managers/policies:/app/core/settings/managers/policies
      
      # Mount logs (optional - for log persistence)
      - ../backend/loggers/logs:/app/loggers/logs
    depends_on:
      - keycloak
    networks:
      - ams-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: ams-keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
      - KC_HTTP_PORT=8080
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
      - KC_LOG_LEVEL=INFO
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ../backend/config/keycloak-realm-export.json:/opt/keycloak/data/import/ams-portal-realm.json:ro
    networks:
      - ams-network
    restart: unless-stopped
    command: start-dev --import-realm

volumes:
  keycloak_data:

networks:
  ams-network:
    driver: bridge