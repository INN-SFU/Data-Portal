# Use native Auto DevOps jobs (Auto Build/Test/Security/Deploy)
include:
  # - template: Auto-DevOps.gitlab-ci.yml
  - local: '/.gitlab/Auto-DevOps.gitlab-ci.yml' # local copy of the Auto DevOps template for customizations
  - local: '/.gitlab/ci/ruff.yml'    # Ruff code quality check from common local library.
  - local: '/.gitlab/deploy/nomad-deploy.yml'  # Nomad deployment integration with Auto DevOps

# # Route jobs to the runner that mounts /var/run/docker.sock
# default:
#   tags:
#     - inn-runner-docker   # <-- tag of your Docker-capable runner

# Tell Auto DevOps to build from backend/
variables:
  DOCKER_API_VERSION: "1.41"

  DOCKERFILE_PATH: backend/Dockerfile
  AUTO_DEVOPS_BUILD_IMAGE_CONTEXT: backend
  
  # Enable BuildKit for faster builds and better caching
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"
  
  # Enable inline cache in images for future cache sources
  # Note: BUILDKIT_INLINE_CACHE=1 is added as build-arg in AUTO_DEVOPS_BUILD_IMAGE_EXTRA_ARGS
  # Local runner cache is used automatically by Docker if configured
  # See docs/gitlab-runner-local-cache-config.md for runner configuration
  
  # Add multiple image tags at build time (branch + short SHA)
  # Auto DevOps will append these to the docker build as repeated --tag flags.
  AUTO_DEVOPS_BUILD_IMAGE_EXTRA_ARGS: >
    --tag ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHA}
    --tag ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_REF_SLUG}
    --tag ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}
    --build-arg BUILDKIT_INLINE_CACHE=1

  # Nomad deployment configuration
  SERVICE_NAME: "backend"
  NOMAD_DEPLOY_ENABLED: "${NOMAD_DEPLOY_ENABLED:-true}"
  # NOMAD_EXTERNAL_ACCESS not set - uses defaults:
  #   - Review Apps: external access enabled (for testing)
  #   - Production/Staging/Development: internal only (service discovery)
  
  # Enable staging deployment (requires manual promotion to production)
  # When enabled: staging deploys automatically, production requires manual promotion
  STAGING_ENABLED: "${STAGING_ENABLED:-true}"
  
  # Disable Auto DevOps Kubernetes deployment (we use Nomad instead)
  # This prevents Auto DevOps from trying to deploy to Kubernetes
  DEPLOY_DISABLED: "${DEPLOY_DISABLED:-true}"
  # Explicitly disable Auto DevOps review jobs to prevent job name conflicts
  REVIEW_DISABLED: "true"
  
# Safety net test (kept until Auto Test/Herokuish consistently reliably detects tests)
test-backend:
  stage: test
  image: python:3.12
  before_script:
    - cd backend
    - pip install -r requirements.txt
  script:
    - pytest -q --junit-xml=backend-test-report.xml || echo "Tests failed or not detected by Auto DevOps"
  artifacts:
    reports:
      junit: backend/backend-test-report.xml
    paths:
      - backend-test-report.xml
      - backend/backend-test-report.xml
    when: always

code_quality_ruff_check:
  extends: .ruff-check-template
  variables:
    RUFF_TARGET: backend
    RUFF_REPORT: backend-code-quality-report.json

# Post-build: add timestamp tag and branch-specific 'latest' tags
retag-backend:
  stage: build
  image: docker:27-cli
  needs:
    # Make build dependency optional because Auto DevOps may not create the build job
    # in certain conditions (e.g., only/except rules, branch conditions). However,
    # we enforce that retag only runs when build has completed by checking build job
    # status in the script below.
    - job: build
      artifacts: false
      optional: true
  # services:
  #   - docker:27-dind
  variables:
    # DOCKER_HOST: tcp://docker:2375
    DOCKER_API_VERSION: "1.41"
    # DOCKER_TLS_CERTDIR: ""
    # Using Docker socket - no DinD service needed
  rules:
    - when: on_success
  script:
    # Wait for DinD/Docker daemon to be ready
    - until docker info >/dev/null 2>&1; do echo "Waiting for Docker daemon..."; sleep 2; done
    # Use shared pipeline timestamp (set in root pipeline's generate-timestamp job)
    # Note: Fallback is handled in the parent job, so PIPELINE_TIMESTAMP is always set
    - ts="$PIPELINE_TIMESTAMP"
    - | 
      echo "Using pipeline timestamp: $ts"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Pull the image built by Auto DevOps and verify build completed
    # Try Auto DevOps tags. Stop at first success. Only retag if image was successfully pulled.
    - |
      SOURCE_IMAGE=""
      for tag in "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}" \
                 "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHA}"; do
        echo "Trying to pull: $tag"
        if docker pull "$tag" 2>/dev/null; then
          SOURCE_IMAGE="$tag"
          echo "Build job completed - successfully pulled image: $SOURCE_IMAGE"
          break
        fi
      done
      if [ -z "$SOURCE_IMAGE" ]; then
        echo "Error: Build job did not complete or image not found in registry."
        echo "Retag job requires build job to complete successfully."
        exit 1
      fi

    # Tag with timestamp (e.g., backend:20251222-2357)
    - docker tag "$SOURCE_IMAGE" "${CI_REGISTRY_IMAGE}/backend:${ts}"
    - docker push "${CI_REGISTRY_IMAGE}/backend:${ts}"

    # 'latest' for default branch (usually main)
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$SOURCE_IMAGE" "${CI_REGISTRY_IMAGE}/backend:latest"
        docker push "${CI_REGISTRY_IMAGE}/backend:latest"
      fi

    # 'latest-dev' for development branch
    - |
      if [ "$CI_COMMIT_BRANCH" = "development" ]; then
        docker tag "$SOURCE_IMAGE" "${CI_REGISTRY_IMAGE}/backend:latest-dev"
        docker push "${CI_REGISTRY_IMAGE}/backend:latest-dev"
      fi
