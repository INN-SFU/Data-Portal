
variables:
  DOCKER_API_VERSION: "1.41"

services:
  - docker:27-dind

runner:
  stage: build
  tags:
    - inn-runner   # Replace with the tag you set during runner registration
  # image: ruby:3.1       # Matches the executor image you configured
  script:
    - echo "✅ Runner is working!"
    - sudo docker version           # Check docker version

# include: 
#   - frontend/.gitlab-ci.yml


stages: [triggers]

# Trigger Auto DevOps for the frontend only when frontend/ changes
frontend-autodevops:
  stage: triggers
  trigger:
    include:
      - local: 'frontend/.gitlab-ci.autodevops.yml'  # child config
  rules:
    - changes:
        - frontend/**/*
      when: on_success
      # Optional: avoid "run everything" on manual/scheduled pipelines:
      # compare_to: main
  # Variables can also be passed here if you prefer not to define them in the child file
  # variables:
  #   DOCKERFILE_PATH: frontend/Dockerfile
  #   AUTO_DEVOPS_BUILD_IMAGE_CONTEXT: frontend

# Trigger Auto DevOps for the backend only when backend/ changes
backend-autodevops:
  stage: triggers
  trigger:
    include:
      - local: 'backend/.gitlab-ci.autodevops.yml'   # child config
  rules:
    - changes:
        - backend/**/*
      when: on_success
      # compare_to: main
``
